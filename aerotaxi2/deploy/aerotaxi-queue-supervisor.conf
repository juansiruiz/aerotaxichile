# Supervisor configuration for Aerotaxi Queue Workers
# Location: /etc/supervisor/conf.d/aerotaxi-queue.conf
#
# Installation steps:
# 1. Copy this file to /etc/supervisor/conf.d/aerotaxi-queue.conf
# 2. Run: sudo supervisorctl reread && sudo supervisorctl update
# 3. Monitor: sudo supervisorctl tail aerotaxi-queue stdout
#
# Commands:
# sudo supervisorctl start aerotaxi-queue:*        # Start all workers
# sudo supervisorctl stop aerotaxi-queue:*         # Stop all workers
# sudo supervisorctl restart aerotaxi-queue:*      # Restart all workers
# sudo supervisorctl status aerotaxi-queue         # Check status

[program:aerotaxi-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/aerotaxi/artisan queue:work redis --queue=default,notifications,high --tries=3 --timeout=90 --backoff=3
autostart=true
autorestart=true
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/aerotaxi-queue.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=5
user=www-data
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME=/home/www-data,LARAVEL_ENV=production
stopasgroup=true
stopwaitsecs=3600

# Priority configuration for graceful shutdown
priority=999

# Event listeners for failed jobs
[program:aerotaxi-failed-queue]
process_name=%(program_name)s
command=php /var/www/aerotaxi/artisan queue:failed-table
autostart=false
autorestart=false
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/aerotaxi-failed-queue.log
user=www-data

# Scheduler for Laravel scheduled tasks
[program:aerotaxi-scheduler]
process_name=%(program_name)s
command=php /var/www/aerotaxi/artisan schedule:run
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/aerotaxi-scheduler.log
stdout_logfile_maxbytes=5242880
stdout_logfile_backups=5
user=www-data
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME=/home/www-data,LARAVEL_ENV=production
stopasgroup=true

# Group for easier management
[group:aerotaxi-workers]
programs=aerotaxi-queue,aerotaxi-scheduler
priority=999
