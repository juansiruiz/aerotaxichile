# Nginx Configuration for Aerotaxi Production
# Location: /etc/nginx/sites-available/aerotaxi
#
# Installation steps:
# 1. Copy this file to /etc/nginx/sites-available/aerotaxi
# 2. Create symlink: ln -s /etc/nginx/sites-available/aerotaxi /etc/nginx/sites-enabled/
# 3. Test config: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
#
# Enable HTTPS with Let's Encrypt:
# sudo certbot certonly --nginx -d aerotaxi.cl -d www.aerotaxi.cl
# sudo systemctl enable certbot.timer

# Upstream PHP-FPM pool
upstream app {
    server 127.0.0.1:9000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name aerotaxi.cl www.aerotaxi.cl;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aerotaxi.cl www.aerotaxi.cl;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/aerotaxi.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aerotaxi.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Client limits
    client_max_body_size 20M;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Logging
    access_log /var/log/nginx/aerotaxi_access.log combined buffer=32k flush=1m;
    error_log /var/log/nginx/aerotaxi_error.log warn;

    # Application root
    root /var/www/aerotaxi/public;
    index index.php;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to Laravel directories
    location ~ ^/(database|storage|bootstrap|config)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (for load balancers)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # FastCGI parameters
        include fastcgi_params;

        # Performance parameters
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Keep connection alive
        fastcgi_keep_conn on;
    }

    # Deny direct access to PHP files in public directory
    location ~ /\. {
        return 404;
    }
}

# Rate limiting configuration
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# API rate limiting
server {
    listen 443 ssl http2;
    server_name api.aerotaxi.cl;

    # SSL configuration (same as above)
    ssl_certificate /etc/letsencrypt/live/aerotaxi.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aerotaxi.cl/privkey.pem;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app;
    }

    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://app;
    }
}
